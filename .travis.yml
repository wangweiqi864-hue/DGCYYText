language: objective-c
osx_image: xcode8
xcode_project: Framework/DGCYYText.xcodeproj
xcode_scheme: DGCYYText

before_install:
- env
- xcodebuild -version
- xcodebuild -showsdks
- xcpretty --version

script:
- set -o pipefail
- xcodebuild clean build -project "$TRAVIS_XCODE_PROJECT"  -scheme "$TRAVIS_XCODE_SCHEME" | xcpretty
